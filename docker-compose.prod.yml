services:
  app:
    image: ${DOCKER_APP_IMAGE:-ghcr.io/chegal-oss/accommodation-rental-service:latest}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${DOCKER_SECRET_KEY}
      DEBUG: ${DOCKER_DEBUG:-False}
      ALLOWED_HOSTS: ${DOCKER_ALLOWED_HOSTS:-chegal.duckdns.org}
      CSRF_TRUSTED_ORIGINS: ${DOCKER_CSRF_TRUSTED_ORIGINS:-https://chegal.duckdns.org}
      USE_X_FORWARDED_HOST: ${DOCKER_USE_X_FORWARDED_HOST:-True}
      SESSION_COOKIE_SECURE: ${DOCKER_SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${DOCKER_CSRF_COOKIE_SECURE:-True}
      DATABASE_ENGINE: ${DOCKER_DATABASE_ENGINE:-sqlite}
      SQLITE_DATABASE_PATH: ${DOCKER_SQLITE_DATABASE_PATH:-/app/data/db.sqlite3}
      MYSQL_DATABASE: ${DOCKER_MYSQL_DATABASE:-homerent}
      MYSQL_USER: ${DOCKER_MYSQL_USER:-homerent}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-}
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-db}
      MYSQL_PORT: ${DOCKER_MYSQL_PORT:-3306}
      POSTGRES_DATABASE: ${DOCKER_POSTGRES_DATABASE:-homerent}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-homerent}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-}
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${DOCKER_POSTGRES_PORT:-5432}
      CAPTCHA_ENABLED: ${DOCKER_CAPTCHA_ENABLED:-True}
      TURNSTILE_SECRET_KEY: ${DOCKER_TURNSTILE_SECRET_KEY}
      CAPTCHA_VERIFY_TIMEOUT: ${DOCKER_CAPTCHA_VERIFY_TIMEOUT:-5}
      DRF_ANON_THROTTLE_RATE: ${DOCKER_DRF_ANON_THROTTLE_RATE:-300/hour}
      DRF_USER_THROTTLE_RATE: ${DOCKER_DRF_USER_THROTTLE_RATE:-3000/hour}
      DRF_AUTH_REGISTER_THROTTLE_RATE: ${DOCKER_DRF_AUTH_REGISTER_THROTTLE_RATE:-20/hour}
      DRF_AUTH_TOKEN_THROTTLE_RATE: ${DOCKER_DRF_AUTH_TOKEN_THROTTLE_RATE:-30/hour}
      DRF_AUTH_REFRESH_THROTTLE_RATE: ${DOCKER_DRF_AUTH_REFRESH_THROTTLE_RATE:-120/hour}
      LOG_LEVEL: ${DOCKER_LOG_LEVEL:-INFO}
      DJANGO_SUPERUSER_EMAIL: ${DOCKER_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DOCKER_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_NAME: ${DOCKER_SUPERUSER_NAME:-Admin}
      DJANGO_SUPERUSER_PHONE: ${DOCKER_SUPERUSER_PHONE:-}
      SEED_DEMO: ${DOCKER_SEED_DEMO:-False}
    volumes:
      - sqlite_data:/app/data
      - staticfiles:/app/staticfiles
      - media:/app/media

  db:
    image: mysql:8.4
    profiles:
      - mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_MYSQL_DATABASE:-homerent}
      MYSQL_USER: ${DOCKER_MYSQL_USER:-homerent}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DATABASE:-homerent}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-homerent}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${DOCKER_CADDY_SITE_ADDRESS:-chegal.duckdns.org}
    ports:
      - "${DOCKER_HTTP_PORT:-80}:80"
      - "${DOCKER_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  sqlite_data:
  mysql_data:
  postgres_data:
  staticfiles:
  media:
  caddy_data:
  caddy_config:
